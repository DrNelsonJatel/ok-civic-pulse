name: qaqc

# Code and codebook checks only. The DuckDB files are deliberately not
# committed (they hold comment text), so the data-integrity checks report as
# SKIPPED here rather than passing silently — see inst/dev/07_qaqc.R.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  qaqc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # use-public-rspm pulls precompiled Linux binaries from Posit Package
      # Manager: ~2 min instead of ~45 min compiling from source.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6"
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::duckdb
            any::dplyr
            any::yaml
            any::digest
            any::stringr
            any::tibble
            any::igraph

      - name: QAQC
        run: Rscript inst/dev/07_qaqc.R

      - name: Codebook must be valid YAML and self-consistent
        run: |
          Rscript -e 'source("R/codebook.R"); cb <- codebook_load();
            cat("codebook", cb$version, "with", length(cb$issues), "issues\n")'
