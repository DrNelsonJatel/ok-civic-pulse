label: v3 seed widening from the 42k-post corpus (evidence-driven, then calibrated) -
  agriculture_alr (ostrich cull/CFIA/avian flu, absent from v1), drugs_treatment,
  housing, economic_dev, water_sewer
description: 'Municipal sphere-of-influence codebook for Okanagan civic discourse.
  Scope is the central judgement: which level of government owns the issue.'
scopes:
  local: a municipal council or regional board has direct authority
  ballot: not municipal, but the office IS elected on 2026-10-17 (school trustees;
    regional district electoral area directors)
  shared: a real local role, but the province holds the main levers
  provincial: provincial responsibility, often misdirected at council
  federal: federal responsibility
weak_gate_codes:
- governance_process
issues:
- code: tax_budget
  label: Property tax & municipal budget
  scope: local
  definition: Property tax rates, mill rate, the annual municipal budget, user fees,
    development cost charges, municipal spending priorities and debt.
  seeds: property tax|\bmill rate\b|municipal budget|city budget|tax increase|tax
    hike|taxpayer|user fee|\bDCCs?\b|development cost charge|budget deliberation|asset
    management
- code: land_use_zoning
  label: Zoning & land use
  scope: local
  definition: Zoning bylaws, Official Community Plan, rezoning applications, variances,
    density, land use designation, urban containment boundary.
  seeds: \bzoning\b|\brezon|\bOCP\b|official community plan|land use|\bvariance\b|\bdensity\b|\bsetback\b|urban
    containment|\bupzon|spot zoning
- code: development_approvals
  label: Development & building approvals
  scope: local
