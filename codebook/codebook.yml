    affordab|\btenant\b|\bmortgage\b|\brental\b|\brenters?\b|\bhomeowner|housing market
- code: short_term_rentals
  label: Short-term rentals
  scope: shared
  definition: Airbnb/VRBO regulation, STR business licensing and enforcement. Municipalities
    licence and enforce; the province sets the principal-residence framework.
  seeds: short[- ]term rental|\bAirbnb\b|\bVRBO\b|\bSTRs?\b(?! ?Act)|vacation rental|nightly
    rental
- code: roads_traffic
  label: Local roads, traffic & parking
  scope: local
  definition: Municipal road maintenance, potholes, traffic calming, intersections,
